<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AssessMe Add-in</title>

    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css" />
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body class="ms-font-m ms-welcome ms-Fabric">
    <header class="ms-welcome__header ms-bgColor-neutralLighter">
        <img width="90" height="90" src="../../assets/logo-filled.png" alt="AssessMe Logo" title="AssessMe" />
        <h1 class="ms-font-su">AssessMe Word</h1>
    </header>

    <main id="app-body" class="ms-welcome__main">
        <h2 class="ms-font-xl">Recording Your Activity</h2>

        <div id="statusBanner" class="status-banner status-active">
            ✅ AssessMe is recording your activity.
        </div>

        <div id="controls">
            <div class="select-container">
                <label for="intensitySelect" class="toggle-label">Logging Intensity:</label>
                <select id="intensitySelect">
                    <option value="high" selected>High (10s)</option>
                    <option value="medium">Medium (30s)</option>
                    <option value="low">Low (60s)</option>
                </select>
            </div>
        </div>

    </main>
</body>

</html>
